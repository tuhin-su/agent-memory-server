# DATA_VOLUME in .env controls storage:
#   named volume  → DATA_VOLUME=memdata          (Docker manages it, auto-created)
#   absolute path → DATA_VOLUME=/home/you/data   (bind-mount, folder must exist)
#   relative path → DATA_VOLUME=./data           (bind-mount relative to this file)

services:
  api:
    build: .
    ports: ["${API_HOST:-127.0.0.1}:${API_PORT:-8080}:${API_PORT:-8080}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://mem:${POSTGRES_PASSWORD:?run setup.sh}@db:5432/memory
      ADMIN_TOKEN: ${ADMIN_TOKEN:?run setup.sh}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-2000000}
    volumes:
      - "${DATA_VOLUME:-memdata}:/data"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run setup.sh}
      POSTGRES_DB: memory
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem -d memory"]
      interval: 5s
      retries: 10
    restart: unless-stopped

# Named volumes — only used when DATA_VOLUME is NOT a path (no leading / or ./)
volumes:
  memdata:
  pgdata:
