services:
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]   # localhost only. Use Tailscale/WireGuard/TLS proxy to expose.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://mem:${POSTGRES_PASSWORD:?set in .env}@db:5432/memory
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      DATA_DIR: /data
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}      # ollama | none
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_DIM: ${EMBED_DIM:-768}
    volumes: ["memdata:/data"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: memory
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem -d memory"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  memdata:
  pgdata:
